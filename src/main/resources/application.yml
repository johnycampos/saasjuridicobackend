spring:
  application:
    name: jurisflow-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: 900000
    refresh-expiration: 604800000
  frontend-url: ${FRONTEND_URL:http://localhost}
  cors-origins: ${CORS_ORIGINS:http://localhost}
  # chave de sistema pro endpoint de integracao /api/integrations/movimentos/sync
  # (script externo, ver com.jurisflow.security.ApiKeyAuthFilter). Sem default:
  # se nao configurada, toda chamada ao endpoint eh rejeitada (falha segura).
  integrations-api-key: ${INTEGRATIONS_API_KEY:}
  google-calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/google-calendar/callback}
    token-encryption-key: ${CALENDAR_TOKEN_ENCRYPTION_KEY:}
  datajud:
    base-url: ${DATAJUD_SYNC_BASE_URL:}
    api-key: ${DATAJUD_SYNC_API_KEY:}
    rate-limit-seconds: ${DATAJUD_RATE_LIMIT_SECONDS:60}

